<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>极简任务聚焦卡片 (Minimal Focus Card)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 620px;
      height: 420px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
      font-family: var(--apple-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      user-select: none;
    }
    #focusCardContainer {
      width: 604px;
      height: 404px;
      margin: 8px;
    }
  </style>
</head>
<body id="hudBody" class="apple-dark-theme antialiased">

  <!-- ==================== 620×420 极简任务聚焦卡片 (Minimal Focus Card) ==================== -->
  <div id="focusCardContainer" class="apple-glass rounded-3xl p-4 shadow-2xl relative flex flex-col justify-between overflow-hidden border border-white/15 focus-aura-tier-1 transition-all duration-300">
    
    <!-- 1. 统一拖拽与控制顶栏 (macOS Unified Drag Header ~40px) -->
    <div class="window-drag-region flex items-center justify-between pb-2.5 border-b border-white/10 cursor-move flex-shrink-0">
      <div class="flex items-center gap-2">
        <!-- 交通灯控制 -->
        <div class="window-no-drag flex items-center gap-1.5 mr-1">
          <div onclick="hideHud()" class="traffic-dot traffic-dot-close" title="收起/隐藏卡片 (Alt+F)"></div>
          <div onclick="minimizeHud()" class="traffic-dot traffic-dot-min" title="最小化"></div>
          <div onclick="openWarRoom()" class="traffic-dot traffic-dot-max" title="展开全景作战室 (Alt+W)"></div>
        </div>

        <span class="text-xs text-sky-400 font-bold tracking-tight flex items-center gap-1">
          <span>🎯</span>
          <span class="truncate max-w-[140px]" id="hudCampaignTitle">探索课题</span>
        </span>
        <span id="hudDeltaQ" class="text-[10px] font-mono font-bold text-sky-300 bg-sky-500/15 px-2 py-0.5 rounded-full border border-sky-400/25">探索进度 58%</span>
        <span id="hudStepProgress" class="text-[10px] font-mono font-bold text-emerald-300 bg-emerald-500/20 px-2 py-0.5 rounded-full border border-emerald-400/30">已验证微动作：0 步</span>
      </div>
      
      <div class="window-no-drag flex items-center gap-2">
        <button onclick="toggleSidebar()" class="apple-capsule-btn px-2.5 py-1 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-200 hover:text-white text-[11px] font-semibold border border-emerald-400/30 transition shadow-sm" title="打开 Antigravity 贴附侧边栏 (Alt+S)">
          <span>📑 贴附侧边栏</span>
          <span class="text-[9px] text-emerald-300/60 font-mono">Alt+S</span>
        </button>
        <button onclick="toggleQuickInput()" class="apple-capsule-btn px-2.5 py-1 bg-white/10 hover:bg-white/15 text-sky-300 text-[11px] font-semibold border border-white/15 transition" title="快速沉淀观察 (Alt+Space)">
          <span>+ 记发现</span>
          <span class="text-[9px] text-white/40 font-mono">⌥Space</span>
        </button>
        <button onclick="openWarRoom()" class="apple-capsule-btn px-2.5 py-1 bg-sky-500/20 hover:bg-sky-500/30 text-sky-200 hover:text-white text-[11px] font-semibold border border-sky-400/30 transition shadow-sm" title="展开全景作战室 (Alt+W)">
          <span>🧭 全景作战室</span>
          <span class="text-[9px] text-sky-300/60 font-mono">Alt+W</span>
        </button>
      </div>
    </div>

    <!-- 2. 中心 Hero 微动作聚焦卡片 (Single-Focus Hero Action Area ~185px) -->
    <div id="heroActionCard" class="bg-gradient-to-br from-white/[0.08] to-white/[0.03] border border-white/15 rounded-2xl p-4 my-2 flex flex-col justify-between shadow-inner relative overflow-hidden">
      
      <!-- 卡片属性微标：物理动词徽章 + 耗时预估 + 极低阻力提示 -->
      <div class="flex items-center justify-between mb-1.5">
        <div class="flex items-center gap-2">
          <span id="hudVerbBadge" class="px-2.5 py-0.5 rounded-md bg-emerald-500/25 border border-emerald-400/30 text-emerald-300 text-[11px] font-bold tracking-wide">
            ⚡ 打开
          </span>
          <span id="hudEstTime" class="px-2 py-0.5 rounded-md bg-white/10 text-white/80 text-[10px] font-mono font-semibold">
            ⏱️ 2分钟内
          </span>
          <span class="text-[11px] text-white/50">
            当下一件事 · 消除启动阻力
          </span>
        </div>
        <div id="hudStepBadge" class="text-xs font-mono font-bold text-emerald-300 bg-emerald-400/10 px-2 py-0.5 rounded border border-emerald-400/20">
          ⚡ 就地执行
        </div>
      </div>

      <!-- 22px-24px 大字号纯白话 Hero 动作描述 -->
      <div class="py-1">
        <div id="hudHeroAction" class="text-[22px] md:text-[23px] font-extrabold text-white leading-snug tracking-tight text-center px-1 select-text drop-shadow-md">
          打开命令行终端，输入 python -V 确认当前运行环境
        </div>
      </div>

      <!-- 一键达成按钮 (1-Click Completion Button) -->
      <div class="mt-2 window-no-drag">
        <button id="hudActionBtn" onclick="completeBounty()" class="w-full py-2.5 rounded-xl apple-capsule-btn apple-btn-success text-white font-extrabold text-sm tracking-wide shadow-lg transition active:scale-[0.98] flex items-center justify-center gap-2">
          <span class="text-base">✓</span>
          <span id="hudActionBtnLabel">达成！搞定当前微动作并推进下一步</span>
        </button>
      </div>

    </div>

    <!-- 3. 卡点与破局启发锚点 (Bottleneck & Heuristic Strip ~60px) -->
    <div class="bg-rose-950/25 border border-rose-500/25 rounded-xl px-3 py-2 flex items-center justify-between text-xs flex-shrink-0">
      <div class="flex-1 pr-3">
        <div class="flex items-center gap-1.5 text-rose-300 text-[11px] font-bold">
          <span>🚧 关联卡点:</span>
          <span id="hudBossText" class="truncate font-normal text-rose-100/90 max-w-[240px]">尚未识别具体障碍</span>
        </div>
        <div class="text-[10px] text-white/60 truncate mt-0.5 flex items-center gap-1" id="hudHeuristicText">
          <span>💡 破局启发:</span>
          <span class="text-amber-200/90">先在 15 分钟内执行单一变量 A/B 实测，杜绝概念纠缠</span>
        </div>
      </div>
      <div class="flex flex-col items-end flex-shrink-0 pl-2 border-l border-white/10">
        <span class="text-[9px] uppercase font-mono text-white/40">卡点收敛进度</span>
        <span id="hudObstacleConvergence" class="font-mono text-xs font-bold text-rose-400">收敛 65%</span>
      </div>
    </div>

    <!-- 4. 底栏与心流结界状态指示 (Bottom Status Bar ~35px) -->
    <div class="flex items-center justify-between pt-2 border-t border-white/10 text-[11px] text-white/50 flex-shrink-0">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="hudAuraStatusText" class="text-white/70 font-medium">心流伴随结界: 冰川天蓝律动中</span>
      </div>
      <div class="flex items-center gap-3 font-mono text-[10px] text-white/40">
        <span>全景热键: <kbd class="px-1 py-0.5 bg-white/10 rounded text-white/70">Alt+W</kbd></span>
        <span>聚焦热键: <kbd class="px-1 py-0.5 bg-white/10 rounded text-white/70">Alt+F</kbd></span>
      </div>
    </div>

    <!-- 快捷情报录入抽屉 (Alt+Space 呼出) -->
    <div id="quickInputDrawer" class="hidden absolute inset-x-4 bottom-14 bg-slate-900/95 border border-sky-400/40 rounded-2xl p-3 shadow-2xl backdrop-blur-2xl z-30 transition-all">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <select id="quickTypeSelect" class="bg-black/70 border border-white/20 rounded-lg text-xs text-sky-300 px-2 py-1 focus:outline-none">
            <option value="observation">👁️ 现象观察</option>
            <option value="question">❓ 核心疑问</option>
            <option value="hypothesis">💡 机制假说</option>
            <option value="evidence">🔬 实测证据</option>
            <option value="bottleneck">🚧 思维瓶颈</option>
          </select>
          <span class="text-[10px] text-white/50">输入回车沉淀至因果图谱</span>
        </div>
        <button onclick="toggleQuickInput(false)" class="text-white/40 hover:text-white text-xs">✕</button>
      </div>
      <input type="text" id="hudQuickInput" class="w-full bg-black/60 border border-white/20 rounded-xl px-3 py-2 text-xs text-white placeholder-white/40 focus:outline-none focus:border-sky-400" placeholder="记录突发观察、反例或实验数据 (Enter 提交)...">
    </div>

  </div>

  <script src="services/audio-fx.js"></script>
  <script src="hud.js"></script>
</body>
</html>
